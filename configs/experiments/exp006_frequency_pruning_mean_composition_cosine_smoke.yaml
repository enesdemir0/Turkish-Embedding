# exp006 smoke test — cheap-first plumbing check for frequency_pruning, BEFORE
# committing to the full-scale exp006 config's real Cosmos + Wikipedia-40-langs
# downloads and Colab A100 time. Small corpus_subsample_fraction and small
# train/target vocab sizes, just to confirm the tokenizer-construction pipeline
# (train -> frequency-count -> prune -> splice -> save) runs end-to-end and
# produces an AutoTokenizer-loadable directory that clone_model() can actually
# consume. NOT a real experiment result — a tiny vocab and tiny corpus samples are
# expected to hurt eval metrics badly; only the plumbing is under test here.
#
# Go/no-go signal before running the full-scale exp006 config (see
# SESSION_NOTES.md / the approved plan for this session):
#   1. this run completes all 4 pipeline stages without exceptions
#   2. the saved tokenizer reloads via AutoTokenizer.from_pretrained and
#      round-trips a Turkish sentence without excessive [UNK]
#   3. the logged added_tokens merge-splicing fallback fraction (see
#      frequency_pruning.py's module docstring, assumption 2) isn't dominating
#      the final vocab

experiment:
  number: 6
  description: >
    Cheap-first smoke test of frequency_pruning before committing to full Cosmos +
    Wiki-40-langs downloads on Colab: small corpus_subsample_fraction and small
    train/target vocab sizes, just to confirm the tokenizer-construction pipeline
    runs end-to-end and produces an AutoTokenizer-loadable directory. Not a real
    experiment result — only the plumbing is under test here.

tokenizer_surgery:
  strategy: frequency_pruning
  params:
    corpus_subsample_fraction: 0.01
    turkish_train_vocab_size: 4096
    multilingual_train_vocab_size: 4096
    turkish_native_vocab_size: 2048
    final_vocab_size: 4096
    output_dir: ./tokenizers/frequency_pruning_smoke

embedding_init:
  strategy: mean_composition
  params: {}

model_cloning:
  teacher_model: google/embeddinggemma-300m
  max_seq_length: 8192

distillation:
  strategy: cosine
  params:
    output_dir: ./distilled_model/exp006_smoke
    subsample_fraction: 0.01  # keep distillation cheap too — reuses cosine.py's existing knob

evaluation:
  output_folder: results/exp006_smoke
  batch_size: 64

tracking:
  mlflow_experiment: turkish-embedding
  tags:
    purpose: frequency_pruning_smoke_test

# exp009 smoke test — cheap-first plumbing check for the new compositional
# root+suffix ("KOMBO-style") embedding model_cloning strategy, BEFORE
# committing to a real full-corpus vocab build or any real Colab training
# time. Tiny corpus subsample for vocab-building, tiny root/suffix embedding
# tables, a tiny randomly-initialized 2-layer transformer body (not BERTurk —
# see compositional_root_suffix.py's module docstring for why reusing a
# pretrained body would confound this test), tiny distillation subsample.
# NOT a real experiment result — expected to score badly; only the plumbing
# is under test.
#
# roots_path/suffixes_path below must be built beforehand (no pipeline stage
# owns this — see exp009 plan / SESSION_NOTES.md "Future work" #7):
#   python -c "
#   from src.data.cosmos_corpus import extract_cosmos_corpus_file
#   from src.data.turkish_morphology import build_root_suffix_vocab
#   extract_cosmos_corpus_file('./corpus/cosmos_smoke.txt', subsample_fraction=0.01)
#   build_root_suffix_vocab('./corpus/cosmos_smoke.txt', './vocabs/compositional_root_suffix_smoke')
#   "
#
# Go/no-go signal before scaling to a real vocab-build + real training run:
#   1. vocab-build step completes and oov_fallback_fraction is logged and is
#      not near 100% (i.e. zeyrek is actually segmenting real words, not
#      falling back to whole-word-as-root for nearly everything)
#   2. model_cloning.build() completes, returns a real SentenceTransformer,
#      and .save()/reload round-trips (verified locally already — see
#      compositional_root_suffix.py's RootSuffixEmbedding.load() override —
#      but must also be confirmed for real inside distil-trainer's own
#      internal save/reload path on Colab)
#   3. distillation runs to completion on the tiny subsample without
#      exceptions
#   4. evaluation runs to completion (score itself is expected to be
#      near-random)

experiment:
  number: 9
  description: >
    Cheap-first smoke test of a KOMBO-style compositional root+suffix
    embedding (TURKIS~1.MD section 2.2/5 item 5, SESSION_NOTES.md Future
    work #7): runtime composition of small root+suffix embedding tables via
    zeyrek morphological segmentation, in front of a tiny
    randomly-initialized transformer body. Tiny vocab-build corpus
    subsample, tiny embedding tables, tiny distillation subsample —
    plumbing check only, not a real result.

model_cloning:
  strategy: compositional_root_suffix
  teacher_model: google/embeddinggemma-300m  # distillation teacher only (naming/tagging)
  roots_path: ./vocabs/compositional_root_suffix_smoke/roots.json
  suffixes_path: ./vocabs/compositional_root_suffix_smoke/suffixes.json
  hidden_dim: 64
  max_suffixes_per_word: 8
  tiny_transformer_config:
    num_hidden_layers: 2
    num_attention_heads: 2
    intermediate_size: 128
  tokenizer_name_or_path: dbmdz/bert-base-turkish-128k-cased
  pooling_mode: mean

distillation:
  strategy: cosine
  params:
    output_dir: ./distilled_model/exp009_smoke
    subsample_fraction: 0.01

evaluation:
  output_folder: results/exp009_smoke
  batch_size: 64

tracking:
  mlflow_experiment: turkish-embedding
  tags:
    purpose: compositional_root_suffix_smoke_test

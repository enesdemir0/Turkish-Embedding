# exp006 (10% data) — cheap comparative test: the frequency_pruning tokenizer
# (EMBEDD~3.MD §2 recipe, real target vocab sizes: 65,536 Turkish-native /
# 131,072 final) paired with a 10% fixed-seed distillation subsample — the exact
# same rows as exp001_mean_composition_cosine_10pct.yaml — so any delta isolates
# the tokenizer-surgery choice (frequency_pruning vs. reuse_pretrained) as the
# single variable, at a fraction of the full run's compute cost.
#
# corpus_subsample_fraction=0.1 below: confirmed empirically that trying to train
# a from-scratch BPE tokenizer over the FULL Cosmos Turkish Corpus v1.0 crashed
# the Colab session on RAM (twice) — checked its real HF dataset card afterward:
# 9,075,453 rows / 22.8GB / ~15 BILLION tokens, several orders of magnitude larger
# than the 580K-row corpus this project already handles fine elsewhere
# (alibayram/wikipedia-40-langs-with-embeddings). Training a tokenizer on a large
# *sample* rather than every byte of a corpus is standard practice anyway, not a
# shortcut unique to this project. 10% of Cosmos is still ~900K rows — plenty for
# stable frequency statistics — while keeping RAM within a normal Colab session.
# If this still OOMs, lower this fraction further (e.g. 0.02-0.05) before anything
# else.
#
# Run exp006_..._smoke.yaml FIRST — that one also subsamples the tokenizer-training
# corpora (much more aggressively) with tiny toy vocab sizes, just to prove the
# frequency_pruning plumbing works at all before spending real time here.
#
# Filename convention: the "_10pct" suffix reflects distillation.params.subsample_fraction
# below, so how much data an experiment used is visible from the filename alone.
# NOTE tokenizer_surgery.params.corpus_subsample_fraction is a SEPARATE knob (10%
# of the tokenizer-training corpora), not the same subsample as distillation's.

experiment:
  number: 6
  description: >
    Cheap comparative test: the frequency_pruning tokenizer (EMBEDD~3.MD §2
    recipe, real target vocab sizes, but a 10% sample of the Cosmos/Wiki-40-langs
    corpora due to a confirmed RAM crash at full corpus scale) paired with a 10%
    fixed-seed distillation subsample — the exact same rows as
    exp001_mean_composition_cosine_10pct.yaml — so any delta isolates the
    tokenizer-surgery choice (frequency_pruning vs. reuse_pretrained) as the single
    variable, at a fraction of the full run's compute cost.

tokenizer_surgery:
  strategy: frequency_pruning
  params:
    corpus_subsample_fraction: 0.1
    # Everything else defaults to the paper's own values (real 65,536/131,072
    # vocab targets) — only the training CORPUS size is cut down, per the RAM
    # note above.

embedding_init:
  strategy: mean_composition
  params: {}

model_cloning:
  teacher_model: google/embeddinggemma-300m
  max_seq_length: 8192

distillation:
  strategy: cosine
  params:
    output_dir: ./distilled_model/exp006_10pct
    subsample_fraction: 0.1  # <-- the actual mechanism; filename just reflects it

evaluation:
  output_folder: results/exp006_10pct
  batch_size: 64

tracking:
  mlflow_experiment: turkish-embedding
  # run_name left unset -> auto-derived as
  # exp006_embeddinggemma300m_frequency_pruning_mean_composition_cosine
  # (data_fraction tag below is what distinguishes this from the full-data run in MLflow)
  tags:
    purpose: frequency_pruning_vs_reuse_pretrained_subsample_test
    data_fraction: "10pct"

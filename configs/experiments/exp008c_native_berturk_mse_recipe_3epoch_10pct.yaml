# exp008c — same as exp008b_native_berturk_mse_recipe_10pct.yaml (same
# native_pretrained BERTurk student, same 10% fixed-seed subsample, same MSE
# recipe: loss_type=mse, learning_rate=2e-5, batch_size=64, warmup_ratio=0.1),
# only num_epochs changed 1 -> 3.
#
# Why: exp008b's 1-epoch result (mean 0.427) was a real, broad improvement over
# both exp008 runs (0.395/0.389, both under the wrong — Gemma-clone-tuned —
# hyperparameters), but still short of exp001's 10% baseline (0.587). The
# earlier epoch-bump test (exp008 1->3 epochs) wasn't informative because it
# tested more training under a broken recipe and plateaued. This is the correct
# version of that same test: does more training help now that the recipe
# actually matches the technique? If mean score keeps climbing toward 0.587,
# that's the signal to scale to full data. If it plateaus again, the gap to
# exp001 is more likely a structural one (native_pretrained never inherits any
# of the teacher's weights, unlike transformer_clone, so it may just need a
# fundamentally larger training budget to close the same gap, not merely the
# right recipe).

experiment:
  number: 8
  description: >
    Same as exp008b (BERTurk native_pretrained, 10% fixed-seed subsample, MSE
    recipe: lr=2e-5, batch_size=64, warmup_ratio=0.1), num_epochs bumped 1 -> 3
    to test whether more training under the corrected recipe keeps closing the
    gap to exp001's 10% baseline (0.587) or plateaus the way it did under the
    wrong recipe (exp008's 1->3 epoch bump, which stayed flat at ~0.39).

model_cloning:
  strategy: native_pretrained
  teacher_model: google/embeddinggemma-300m  # distillation teacher only (naming/tagging)
  pretrained_model: dbmdz/bert-base-turkish-128k-cased
  max_seq_length: 512

distillation:
  strategy: cosine
  params:
    output_dir: ./distilled_model/exp008c_mse_recipe_3epoch
    subsample_fraction: 0.1
    loss_type: mse
    learning_rate: 2.0e-5
    batch_size: 64
    warmup_ratio: 0.1
    num_epochs: 3

evaluation:
  output_folder: results/exp008c_mse_recipe_3epoch
  batch_size: 64

tracking:
  mlflow_experiment: turkish-embedding
  tags:
    purpose: native_pretrained_reimers_gurevych_recipe_3epoch_test
    data_fraction: "10pct"
    loss_type: mse
    num_epochs: "3"
    compare_against: exp008b_native_berturk_mse_recipe_10pct
